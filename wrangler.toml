name = "chesskidoo"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "chesskidoo-db"
database_id = "e9dadf92-e9e3-4db5-8b40-00b6204218ba"

[[kv_namespaces]]
binding = "SESSIONS"
id = "e7f533fb80b74da48db62943985afb78"

# R2 object storage - replaces Supabase Storage buckets (documents, homework_attachments)
# Create the bucket once with: npx wrangler r2 bucket create chesskidoo-media
[[r2_buckets]]
binding = "chesskidoo_media"
bucket_name = "chesskidoo-media"
